backend:
  name: github
  repo: bryansage97-debug/bryansage-portfolio
  branch: main
  base_url: https://bryansage.org
  auth_endpoint: api/auth

media_folder: "current website/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "current website/cms/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tag", name: "tag", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "about"
    label: "About"
    files:
      - name: "about"
        label: "About Page"
        file: "current website/cms/about.json"
        fields:
          - { label: "Bio Paragraph 1", name: "bio1", widget: "text" }
          - { label: "Bio Paragraph 2", name: "bio2", widget: "text" }
          - { label: "Bio Paragraph 3", name: "bio3", widget: "text" }
